---
- name: Deploy Cue
  hosts: '*'
  become: true
  become_user: root

  tasks:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install required packages
      ansible.builtin.apt:
        state: present
        update_cache: true
        name:
          - ca-certificates
          - curl
          - gnupg2
          - apt-transport-https
          - python3-docker
          - cec-utils
          - iptables

    - name: Create directory for Docker GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present


    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: deb [arch=arm64] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
        state: present

    - name: Install Docker packages
      ansible.builtin.apt:
        state: present
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin

    - name: Start and enable Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add user pi to docker group
      ansible.builtin.user:
        name: 'pi'
        groups: docker
        append: true

    # --- Project directory ---
    - name: Create directory for Cue
      ansible.builtin.file:
        path: /home/pi/cue
        state: directory
        owner: pi
        group: pi
        mode: '0755'

    - name: Generate config.yml from template
      ansible.builtin.template:
        src: config.yml.j2
        dest: /home/pi/cue/config.yml
        owner: pi
        group: pi
        mode: '0600'

    - name: Copy docker-compose.yml
      ansible.builtin.copy:
        src: ./docker-compose.yml
        dest: /home/pi/cue/docker-compose.yml
        mode: '0644'

    - name: Pull latest container image
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: /home/pi/cue/
      changed_when: true

    - name: Run the container
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate
        chdir: /home/pi/cue/
      changed_when: true

    - name: Ensure container is running
      community.docker.docker_container:
        name: cue
        state: started
        restart_policy: unless-stopped

    - name: Install python3-pil for framebuffer image display
      ansible.builtin.apt:
        state: present
        name: python3-pil

    - name: Check if splash image exists locally
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/splash/splash.png"
      register: splash_image
      delegate_to: localhost
      become: false

    - name: Copy splash image
      ansible.builtin.copy:
        src: ./splash/splash.png
        dest: /home/pi/cue/splash.png
        owner: pi
        group: pi
        mode: '0644'
      when: splash_image.stat.exists

    - name: Copy splash writer script
      ansible.builtin.copy:
        src: ./splash/show_splash.py
        dest: /home/pi/cue/show_splash.py
        owner: pi
        group: pi
        mode: '0755'

    - name: Create splash screen systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/cue-splash.service
        mode: '0644'
        content: |
          [Unit]
          Description=Cue Splash Screen
          After=local-fs.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/bin/python3 /home/pi/cue/show_splash.py /home/pi/cue/splash.png

          [Install]
          WantedBy=multi-user.target
      notify: Reload systemd

    - name: Reset any previous failed state for splash service
      ansible.builtin.command:
        cmd: systemctl reset-failed cue-splash.service
      failed_when: false
      changed_when: false

    - name: Enable and start splash service
      ansible.builtin.systemd:
        name: cue-splash
        enabled: true
        state: "{{ 'restarted' if splash_image.stat.exists else 'stopped' }}"
        daemon_reload: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
