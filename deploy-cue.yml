---
- name: Deploy Cue
  hosts: '*'
  become: true
  become_user: root

  tasks:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install required packages
      ansible.builtin.apt:
        state: present
        update_cache: true
        name:
          - ca-certificates
          - curl
          - gnupg2
          - apt-transport-https
          - python3-docker
          - cec-utils
          - iptables

    - name: Create directory for Docker GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directorys
        mode: '0755'

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present


    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: deb [arch=arm64] https://download.docker.com/linux/debian bookworm stable
        state: present

    - name: Install Docker packages
      ansible.builtin.apt:
        state: present
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin

    - name: Start and enable Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add user pi to docker group
      ansible.builtin.user:
        name: 'pi'
        groups: docker
        append: true

    # --- Firewall ---
    - name: Allow port 5000 from Semaphore server only
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "{{ api_port | default(5000) }}"
        source: "{{ semaphore_ip }}"
        jump: ACCEPT

    - name: Block port 5000 from all other sources
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "{{ api_port | default(5000) }}"
        jump: DROP

    - name: Save iptables rules
      ansible.builtin.shell:
        cmd: iptables-save > /etc/iptables/rules.v4
        creates: /etc/iptables/rules.v4

    # --- Project directory ---
    - name: Create directory for Cue
      ansible.builtin.file:
        path: /home/pi/cue
        state: directory
        owner: pi
        group: pi
        mode: '0755'

    - name: Generate config.yml from template
      ansible.builtin.template:
        src: config.yml.j2
        dest: /home/pi/cue/config.yml
        owner: pi
        group: pi
        mode: '0600'

    - name: Copy docker-compose.yml
      ansible.builtin.copy:
        src: ./docker-compose.yml
        dest: /home/pi/cue/docker-compose.yml
        mode: '0644'

    - name: Pull latest container image
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: /home/pi/cue/
      changed_when: true

    - name: Run the container
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate
        chdir: /home/pi/cue/
      changed_when: true

    - name: Ensure container is running
      community.docker.docker_container:
        name: cue
        state: started
        restart_policy: unless-stopped
